<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aya YOUSSFI - Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--cyan:#00d4ff;
--cyan-bright:#5dffff;
--cyan-dark:#0099cc;
--text-dim:#94a3b8;
}

body{
font-family:'Inter',sans-serif;
background:#000;
color:#fff;
overflow-x:hidden;
}

html{scroll-behavior:smooth}

/* PARTICLES CANVAS - OPTIMISÉ */
#particles-canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
will-change:transform; /* Optimisation */
}

/* GRADIENT ORBS - SIMPLIFIÉ */
.gradient-orbs{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
overflow:hidden;
pointer-events:none;
opacity:0.6; /* Réduit l'opacité pour moins de calculs */
}

.orb{
position:absolute;
border-radius:50%;
filter:blur(80px);
opacity:0.3; /* Réduit l'opacité */
animation:float 30s infinite ease-in-out; /* Animation plus lente */
}

.orb1{
width:400px; /* Réduit la taille */
height:400px;
background:radial-gradient(circle,var(--cyan),transparent 70%);
top:-100px;
left:-100px;
}

.orb2{
width:300px;
height:300px;
background:radial-gradient(circle,var(--cyan-bright),transparent 70%);
bottom:-50px;
right:-50px;
animation-delay:-10s;
}

.orb3{
width:250px;
height:250px;
background:radial-gradient(circle,var(--cyan-dark),transparent 70%);
top:50%;
left:50%;
animation-delay:-20s;
}

@keyframes float{
0%,100%{transform:translate(0,0)}
25%{transform:translate(50px,-50px)}
75%{transform:translate(-30px,50px)}
}

.content{position:relative;z-index:1}

/* NAV - OPTIMISÉ */
nav{
position:fixed;
top:0;
width:100%;
padding:20px 40px; /* Réduit le padding */
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,0.8);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(0,212,255,0.2);
z-index:1000;
transition:all 0.3s ease;
will-change:transform, background; /* Optimisation */
}

nav.scrolled{
padding:15px 40px;
background:rgba(0,0,0,0.95);
}

.logo{
font-size:28px;
font-weight:900;
color:var(--cyan);
text-shadow:0 0 15px var(--cyan);
}

.nav-links{display:flex;gap:30px;align-items:center}
.nav-links a{
color:#fff;
text-decoration:none;
font-weight:600;
transition:color 0.3s ease;
position:relative;
padding:5px 0;
}

.nav-links a::before{
content:'';
position:absolute;
bottom:0;
left:0;
width:0;
height:2px;
background:var(--cyan);
transition:width 0.3s ease;
}

.nav-links a:hover{
color:var(--cyan);
}

.nav-links a:hover::before{width:100%}

.nav-links a.active{color:var(--cyan)}
.nav-links a.active::before{width:100%}

.burger{
display:none;
flex-direction:column;
gap:5px;
cursor:pointer;
}

.burger span{
width:25px;
height:2px;
background:var(--cyan);
transition:all 0.3s ease;
}

/* HERO - OPTIMISÉ */
.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:120px 30px;
position:relative;
overflow:hidden;
}

.hero::before{
content:'';
position:absolute;
top:50%;
left:50%;
width:400px; /* Réduit la taille */
height:400px;
background:radial-gradient(circle,rgba(0,212,255,0.1),transparent 70%);
border-radius:50%;
transform:translate(-50%,-50%);
animation:pulseGlow 5s ease-in-out infinite;
pointer-events:none;
}

@keyframes pulseGlow{
0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.2}
50%{transform:translate(-50%,-50%) scale(1.1);opacity:0.4}
}

.hero-content{
position:relative;
z-index:2;
max-width:1200px;
margin:0 auto;
}

.hero h1{
font-size:clamp(48px,8vw,90px);
font-weight:900;
background:linear-gradient(135deg,#fff,var(--cyan));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
filter:drop-shadow(0 0 20px rgba(0,212,255,0.3));
}

.hero-subtitle{
font-size:clamp(16px,2.5vw,22px);
color:var(--text-dim);
margin-bottom:10px;
}

.hero-tagline{
font-size:clamp(14px,2vw,16px);
color:rgba(255,255,255,0.5);
margin-bottom:30px;
}

.cta-group{
margin:30px 0;
}

.btn{
padding:15px 35px;
border:none;
border-radius:50px;
font-size:15px;
font-weight:700;
cursor:pointer;
display:inline-block;
margin:8px;
transition:transform 0.3s ease, box-shadow 0.3s ease;
text-decoration:none;
}

.btn-primary{
background:linear-gradient(135deg,var(--cyan),var(--cyan-bright));
color:#000;
box-shadow:0 5px 20px rgba(0,212,255,0.3);
}

.btn-primary:hover{
transform:translateY(-3px);
box-shadow:0 10px 30px rgba(0,212,255,0.5);
}

.btn-secondary{
background:rgba(0,212,255,0.1);
color:var(--cyan);
border:2px solid var(--cyan);
}

.btn-secondary:hover{
background:rgba(0,212,255,0.2);
transform:translateY(-3px);
}

/* STATS - OPTIMISÉ */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
max-width:800px;
margin:60px auto 0;
}

.stat-card{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:20px;
padding:30px;
transition:transform 0.3s ease;
position:relative;
overflow:hidden;
}

.stat-card:hover{
transform:translateY(-10px);
border-color:var(--cyan);
box-shadow:0 15px 40px rgba(0,212,255,0.2);
}

.stat-number{
font-size:48px;
font-weight:900;
color:var(--cyan);
display:block;
text-shadow:0 0 15px rgba(0,212,255,0.3);
}

.stat-label{
font-size:13px;
color:var(--text-dim);
text-transform:uppercase;
letter-spacing:1px;
}

/* SECTIONS */
section{
padding:100px 40px;
max-width:1200px;
margin:auto;
position:relative;
}

.section-header{
text-align:center;
margin-bottom:60px;
}

.section-tag{
font-size:13px;
color:var(--cyan);
text-transform:uppercase;
letter-spacing:3px;
margin-bottom:10px;
}

.section-title{
font-size:clamp(32px,5vw,48px);
font-weight:900;
background:linear-gradient(135deg,#fff,var(--cyan));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:15px;
}

.section-description{
font-size:16px;
color:var(--text-dim);
max-width:500px;
margin:0 auto;
}

/* ABOUT - OPTIMISÉ */
.about-content{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}

.about-text h3{
font-size:32px;
color:var(--cyan);
margin-bottom:20px;
font-weight:800;
}

.about-text p{
color:rgba(255,255,255,0.7);
margin-bottom:20px;
line-height:1.8;
font-size:15px;
}

.highlight-box{
background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(0,212,255,0.02));
border:1px solid rgba(0,212,255,0.2);
border-left:3px solid var(--cyan);
border-radius:12px;
padding:25px;
margin-top:20px;
}

.highlight-box h4{
color:var(--cyan);
margin-bottom:15px;
font-size:16px;
font-weight:700;
}

.highlight-box ul{
list-style:none;
padding:0;
}

.highlight-box li{
color:rgba(255,255,255,0.8);
padding:8px 0;
padding-left:25px;
position:relative;
font-size:14px;
}

.highlight-box li::before{
content:'▹';
position:absolute;
left:0;
color:var(--cyan);
font-size:18px;
}

/* SKILL BARS - OPTIMISÉ */
.skill-bars-container{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:20px;
padding:35px;
}

.skill-bar{
margin-bottom:25px;
}

.skill-bar:last-child{margin-bottom:0}

.skill-bar-header{
display:flex;
justify-content:space-between;
margin-bottom:8px;
}

.skill-name{
color:#fff;
font-size:14px;
font-weight:600;
}

.skill-percentage{
color:var(--cyan);
font-weight:600;
font-size:14px;
}

.skill-bar-bg{
width:100%;
height:6px; /* Réduit la hauteur */
background:rgba(255,255,255,0.05);
border-radius:6px;
overflow:hidden;
}

.skill-bar-fill{
height:100%;
background:linear-gradient(90deg,var(--cyan-dark),var(--cyan));
border-radius:6px;
width:0;
transition:width 1s cubic-bezier(0.4,0,0.2,1);
}

/* TIMELINE - OPTIMISÉ */
.timeline{
position:relative;
max-width:900px;
margin:0 auto;
padding-left:40px;
}

.timeline::before{
content:'';
position:absolute;
left:0;
top:0;
bottom:0;
width:2px;
background:linear-gradient(180deg,transparent,var(--cyan),transparent);
}

.timeline-item{
position:relative;
margin-bottom:40px;
}

.timeline-item::before{
content:'';
position:absolute;
left:-44px;
top:0;
width:12px;
height:12px;
border-radius:50%;
background:var(--cyan);
box-shadow:0 0 15px var(--cyan);
}

.experience-card{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:16px;
padding:30px;
transition:transform 0.3s ease;
}

.experience-card:hover{
transform:translateX(10px);
border-color:var(--cyan);
box-shadow:0 10px 30px rgba(0,212,255,0.15);
}

.experience-header{
display:flex;
justify-content:space-between;
align-items:start;
margin-bottom:15px;
flex-wrap:wrap;
gap:10px;
}

.experience-title{
font-size:20px;
color:var(--cyan);
margin-bottom:5px;
font-weight:800;
}

.experience-company{
color:rgba(255,255,255,0.8);
font-size:14px;
}

.experience-date{
color:var(--cyan-bright);
font-size:13px;
padding:4px 12px;
background:rgba(0,212,255,0.1);
border-radius:15px;
}

.experience-description{
color:rgba(255,255,255,0.7);
line-height:1.7;
font-size:14px;
}

.experience-description ul{
list-style:none;
padding:0;
margin-top:10px;
}

.experience-description li{
padding:6px 0;
padding-left:20px;
position:relative;
font-size:13px;
}

.experience-description li::before{
content:'◆';
position:absolute;
left:0;
color:var(--cyan);
font-size:12px;
}

/* PROJECTS - OPTIMISÉ */
.projects-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.project-card{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:20px;
padding:30px;
transition:transform 0.3s ease;
position:relative;
overflow:hidden;
}

.project-card:hover{
transform:translateY(-10px);
border-color:var(--cyan);
box-shadow:0 15px 40px rgba(0,212,255,0.2);
}

.project-icon{
font-size:48px;
margin-bottom:20px;
display:block;
filter:drop-shadow(0 0 10px rgba(0,212,255,0.3));
}

.project-title{
font-size:22px;
color:var(--cyan);
margin-bottom:15px;
font-weight:800;
}

.project-description{
color:rgba(255,255,255,0.7);
line-height:1.7;
margin-bottom:20px;
font-size:14px;
}

.project-tags{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.tag{
padding:5px 15px;
background:rgba(0,212,255,0.1);
border:1px solid rgba(0,212,255,0.3);
border-radius:20px;
font-size:12px;
color:var(--cyan-bright);
font-weight:600;
}

/* SKILLS - OPTIMISÉ */
.skills-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.skill-category{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:20px;
padding:30px;
transition:transform 0.3s ease;
}

.skill-category:hover{
transform:translateY(-8px);
border-color:var(--cyan);
box-shadow:0 15px 30px rgba(0,212,255,0.15);
}

.skill-category-icon{
font-size:48px;
margin-bottom:20px;
display:block;
}

.skill-category-title{
font-size:20px;
color:var(--cyan);
margin-bottom:20px;
font-weight:800;
}

.skill-list{
list-style:none;
padding:0;
}

.skill-list li{
color:rgba(255,255,255,0.8);
padding:8px 0;
padding-left:25px;
position:relative;
border-bottom:1px solid rgba(255,255,255,0.03);
font-size:14px;
}

.skill-list li:last-child{border-bottom:none}

.skill-list li::before{
content:'✓';
position:absolute;
left:0;
color:var(--cyan);
font-size:14px;
}

/* CERTIFICATIONS - OPTIMISÉ */
.certifications-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.cert-card{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:16px;
padding:30px;
transition:transform 0.3s ease;
}

.cert-card:hover{
transform:translateY(-8px);
border-color:var(--cyan);
box-shadow:0 15px 30px rgba(0,212,255,0.15);
}

.cert-badge{
width:60px;
height:60px;
background:linear-gradient(135deg,var(--cyan),var(--cyan-bright));
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,212,255,0.3);
}

.cert-title{
font-size:17px;
color:#fff;
margin-bottom:8px;
font-weight:800;
}

.cert-issuer{
color:var(--cyan);
font-size:14px;
margin-bottom:8px;
}

.cert-date{
color:rgba(255,255,255,0.4);
font-size:12px;
}

/* CONTACT - OPTIMISÉ */
.contact-info{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:30px;
max-width:800px;
margin:50px auto 0;
}

.contact-item{
background:rgba(0,212,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(0,212,255,0.2);
border-radius:16px;
padding:30px;
text-align:center;
transition:transform 0.3s ease;
}

.contact-item:hover{
transform:translateY(-8px);
border-color:var(--cyan);
box-shadow:0 15px 30px rgba(0,212,255,0.15);
}

.contact-icon{
font-size:40px;
margin-bottom:15px;
display:block;
}

.contact-label{
color:var(--cyan);
font-size:13px;
margin-bottom:8px;
text-transform:uppercase;
letter-spacing:1px;
}

.contact-value{
color:rgba(255,255,255,0.9);
font-size:15px;
}

/* FOOTER */
footer{
padding:50px;
text-align:center;
border-top:1px solid rgba(0,212,255,0.2);
}

.social-links{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:25px;
}

.social-links a{
width:50px;
height:50px;
background:rgba(0,212,255,0.05);
border:2px solid rgba(0,212,255,0.3);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:var(--cyan);
text-decoration:none;
font-size:20px;
transition:all 0.3s ease;
}

.social-links a:hover{
background:var(--cyan);
color:#000;
transform:translateY(-5px);
border-color:var(--cyan-bright);
}

.footer-text{
color:rgba(255,255,255,0.4);
font-size:13px;
}

/* SCROLL TO TOP */
.scroll-top{
position:fixed;
bottom:30px;
right:30px;
width:45px;
height:45px;
background:linear-gradient(135deg,var(--cyan),var(--cyan-bright));
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
opacity:0;
visibility:hidden;
transition:all 0.3s ease;
z-index:999;
color:#000;
font-size:20px;
box-shadow:0 5px 15px rgba(0,212,255,0.3);
}

.scroll-top.visible{
opacity:1;
visibility:visible;
}

.scroll-top:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,212,255,0.5);
}

/* RESPONSIVE */
@media(max-width:968px){
nav{padding:15px 25px}

.nav-links{
position:fixed;
top:0;
right:-100%;
width:70%;
height:100vh;
background:rgba(0,0,0,0.98);
flex-direction:column;
justify-content:center;
transition:right 0.3s ease;
border-left:1px solid rgba(0,212,255,0.2);
}

.nav-links.active{right:0}

.burger{
display:flex;
z-index:1001;
}

.burger.active span:nth-child(1){
transform:rotate(45deg) translate(5px,5px);
}

.burger.active span:nth-child(2){
opacity:0;
}

.burger.active span:nth-child(3){
transform:rotate(-45deg) translate(5px,-5px);
}

section{padding:70px 25px}
.stats{grid-template-columns:1fr; gap:20px}
.about-content{grid-template-columns:1fr; gap:40px}
.timeline{padding-left:30px}
.timeline-item::before{left:-34px}

/* Désactiver les animations lourdes sur mobile */
.gradient-orbs{opacity:0.3}
.orb{animation:none}
#particles-canvas{opacity:0.5}
}
</style>
</head>
<body>

<!-- Particles Canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Gradient Orbs -->
<div class="gradient-orbs">
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
</div>

<div class="content">

<nav id="navbar">
<div class="logo">AY</div>
<div class="nav-links" id="navLinks">
<a href="#home" class="active">Accueil</a>
<a href="#about">À Propos</a>
<a href="#experience">Expérience</a>
<a href="#projects">Projets</a>
<a href="#skills">Compétences</a>
<a href="#certifications">Certifications</a>
<a href="#contact">Contact</a>
</div>
<div class="burger" id="burger">
<span></span>
<span></span>
<span></span>
</div>
</nav>

<section class="hero" id="home">
<div class="hero-content">
<h1>AYA YOUSSFI</h1>
<p class="hero-subtitle">AI Engineer & Digital Trust Specialist</p>
<p class="hero-tagline">Transformant les données complexes en solutions intelligentes</p>

<div class="cta-group">
<a href="#projects" class="btn btn-primary">Mes Projets</a>
<a href="#contact" class="btn btn-secondary">Contact</a>
</div>

<div class="stats">
<div class="stat-card">
<span class="stat-number">4+</span>
<span class="stat-label">Projets AI</span>
</div>
<div class="stat-card">
<span class="stat-number">4</span>
<span class="stat-label">Certifications</span>
</div>
<div class="stat-card">
<span class="stat-number">5+</span>
<span class="stat-label">Technologies</span>
</div>
</div>
</div>
</section>

<!-- Le reste du contenu HTML reste identique mais avec les optimisations CSS ci-dessus -->
<!-- ... (tout le contenu des sections about, experience, projects, skills, certifications, contact, footer) ... -->

</div>

<script>
// PARTICLES CANVAS OPTIMISÉ
const particlesCanvas = document.getElementById('particles-canvas');
const pCtx = particlesCanvas.getContext('2d');
let animationFrame;
let particles = [];
let isVisible = true;

// Optimisation avec requestAnimationFrame throttling
function initParticles() {
    const width = window.innerWidth;
    const height = document.documentElement.scrollHeight;
    particlesCanvas.width = width;
    particlesCanvas.height = height;
    
    // Réduire le nombre de particules sur mobile
    const particleCount = width < 768 ? 30 : 50;
    
    particles = [];
    for(let i = 0; i < particleCount; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.3
        });
    }
}

// Throttling pour les performances
let lastTime = 0;
const fps = 30;
const interval = 1000 / fps;

function animateParticles(currentTime) {
    if (!isVisible) {
        animationFrame = requestAnimationFrame(animateParticles);
        return;
    }
    
    // Limiter le frame rate
    if (currentTime - lastTime < interval) {
        animationFrame = requestAnimationFrame(animateParticles);
        return;
    }
    
    lastTime = currentTime;
    
    pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
    
    particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        
        if(p.x < 0 || p.x > particlesCanvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > particlesCanvas.height) p.speedY *= -1;
        
        pCtx.fillStyle = `rgba(0,212,255,${p.opacity})`;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fill();
    });
    
    // Réduire la fréquence des connexions
    if (Math.random() > 0.7) { // Seulement 30% du temps
        for(let i = 0; i < particles.length; i += 2) {
            for(let j = i + 1; j < particles.length; j += 2) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 100) {
                    pCtx.strokeStyle = `rgba(0,212,255,${0.1 * (1 - dist/100)})`;
                    pCtx.lineWidth = 0.5;
                    pCtx.beginPath();
                    pCtx.moveTo(particles[i].x, particles[i].y);
                    pCtx.lineTo(particles[j].x, particles[j].y);
                    pCtx.stroke();
                }
            }
        }
    }
    
    animationFrame = requestAnimationFrame(animateParticles);
}

// Optimisation du scroll avec passive event listener
window.addEventListener('scroll', () => {
    const navbar = document.getElementById('navbar');
    navbar.classList.toggle('scrolled', window.scrollY > 50);
}, { passive: true });

// Désactiver les animations quand la page n'est pas visible
document.addEventListener('visibilitychange', () => {
    isVisible = !document.hidden;
    if (isVisible) {
        if (!animationFrame) {
            animationFrame = requestAnimationFrame(animateParticles);
        }
    }
});

// Debounce pour le redimensionnement
let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        initParticles();
    }, 150);
}, { passive: true });

// Initialisation
initParticles();
animationFrame = requestAnimationFrame(animateParticles);

// BURGER MENU
const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
if (burger) {
    burger.addEventListener('click', () => {
        burger.classList.toggle('active');
        navLinks.classList.toggle('active');
    });
}

// ACTIVE NAV - Optimisé avec throttling
let ticking = false;
window.addEventListener('scroll', () => {
    if (!ticking) {
        window.requestAnimationFrame(() => {
            const sections = document.querySelectorAll('section');
            const navLinksAll = document.querySelectorAll('.nav-links a');
            let current = '';
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (window.scrollY >= sectionTop - 200) {
                    current = section.getAttribute('id');
                }
            });
            
            navLinksAll.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').slice(1) === current) {
                    link.classList.add('active');
                }
            });
            
            ticking = false;
        });
        
        ticking = true;
    }
}, { passive: true });

// STATS COUNTER - Optimisé avec Intersection Observer
const statsObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && !entry.target.classList.contains('counted')) {
            entry.target.classList.add('counted');
            const numberElement = entry.target.querySelector('.stat-number');
            if (!numberElement) return;
            
            const originalText = numberElement.textContent.trim();
            const target = parseInt(originalText.replace('+', '')) || 0;
            const hasPlus = originalText.includes('+');
            let current = 0;
            const steps = 30;
            const increment = Math.ceil(target / steps);
            let step = 0;
            
            const timer = setInterval(() => {
                step++;
                current = Math.min(current + increment, target);
                numberElement.textContent = current + (hasPlus && current === target ? '+' : '');
                
                if (step >= steps || current >= target) {
                    numberElement.textContent = target + (hasPlus ? '+' : '');
                    clearInterval(timer);
                }
            }, 20);
        }
    });
}, { threshold: 0.3, rootMargin: '50px' });

document.querySelectorAll('.stat-card').forEach(card => statsObserver.observe(card));

// SKILL BARS
const skillBarsObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.querySelectorAll('.skill-bar-fill').forEach(bar => {
                const width = bar.getAttribute('data-width');
                if (width) {
                    bar.style.width = width + '%';
                }
            });
            skillBarsObserver.unobserve(entry.target);
        }
    });
}, { threshold: 0.2 });

const skillBarsContainer = document.querySelector('.skill-bars-container');
if (skillBarsContainer) skillBarsObserver.observe(skillBarsContainer);

// SCROLL TO TOP
const scrollTop = document.getElementById('scrollTop');
if (scrollTop) {
    window.addEventListener('scroll', () => {
        scrollTop.classList.toggle('visible', window.scrollY > 500);
    }, { passive: true });
    
    scrollTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}

// SMOOTH SCROLL
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
        }
    });
});

// Nettoyage
window.addEventListener('beforeunload', () => {
    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
    }
});
</script>
